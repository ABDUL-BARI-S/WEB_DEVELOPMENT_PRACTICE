<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <h1 class="header"><i class="fa-solid fa-wallet" ></i> Expense Tracker</h1>
    <div class="container">
    <div class="main">
<div class="details">
    <label >Expense Name</label>
    <input type="text"  placeholder="Enter expense name">
</div>

<div class="details">
    <label >Amount</label>
    <input type="number"   placeholder="Enter Amount">
</div>
<div class="details">
    <label >Category</label>
    <select  >
        <option value="">Select Category</option>
        <option value="Clothes">Clothes</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Grocery">Grocery</option>
        <option value="Income">Income</option>
    </select>
</div>
<div class="details">
    <label >Date</label>
    <input type="date">
</div>
<div class="details">
    <button>Add Expense</button>
</div>   
    </div>
<div class="dashboard">
<div class="total_details">

    <div class="card">
        <p ><i class="fa-solid fa-wallet"></i> </p>
        <h5>Total Expenses</h5>
        <p>$XXXXXXX</p>
    </div>
    
    <div class="card">
        <p><i class="fa-solid fa-arrow-trend-up"></i></p>
        <h5>Total Income</h5>
        <p>$XXXXXXX</p>
    </div>
   
    <div class="card">
    <p><i class="fa-solid fa-scale-balanced"></i></p>
    <h5>Balance</h5>
    <p>$XXXXXXX</p>
    </div>


</div>
</div>
</div>


    
</body>
</html>
